<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Simulador de autómatas finitos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Construye un autómata finito determinista, dibuja su gráfica, muestra las cinco palabras más cortas que reconoce y prueba palabras.">
  <meta name="color-scheme" content="light dark">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee el tema del sistema.
    try {
      var theme = localStorage.getItem('simulator-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=Google+Sans+Code:wght@400..600&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
